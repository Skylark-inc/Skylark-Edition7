<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Star</title>
<link rel="stylesheet" href="style.css">

<link rel="icon" href="https://endlesspete.github.io/Star/Favicon_use.jpeg">
<link rel="apple-touch-icon" href="https://endlesspete.github.io/Star/Appicon_star_ed7.png">
</head>

<body>

<!-- MAIN UI -->
<div class="container" id="mainUI">
  <div class="card">

    <h1>Star</h1>

    <div class="button-row">
      <a href="#" class="main-btn">Get Star</a>
      <button onclick="openSettings()">Settings</button>
      <button onclick="openWhatsNew()">What’s New</button>
    </div>

    <div class="credits">
      <p>© <a href="https://x.com/endlesspeteinc" target="_blank">Endlesspete</a></p>
      <p>© <a href="https://x.com/terralinkslabs" target="_blank">Terralinkslabs</a></p>
      <p>© <a href="https://x.com/SkylarkShortcut" target="_blank">Skylark Inc</a></p>
      <span class="version">v1.0 Beta 6</span>
    </div>

  </div>
</div>

<!-- WHAT'S NEW -->
<div id="whatsNewUI">
  <div class="card">
    <h2>What’s New</h2>

    <p>
      • Add your updates here<br>
      • UI improvements<br>
      • Bug fixes
    </p>

    <button onclick="closeWhatsNew()">Back</button>
  </div>
</div>

<!-- SETTINGS -->
<div id="settingsPanel">
  <div class="settings-card">

    <h2>Settings</h2>

    <div class="row">
      <span>Dark Mode</span>
      <label class="switch">
        <input type="checkbox" id="themeToggle">
        <span class="slider"></span>
      </label>
    </div>

    <div class="row">
      <span>Custom Color</span>
      <div class="color-wrap">
        <input type="text" id="colorInput" placeholder="#007aff">
        <button id="setColorBtn">Set</button>
      </div>
    </div>

    <h3>Background</h3>

    <button onclick="setBackground('default')">Default</button>
    <button onclick="setBackground('theme1')">Theme 1</button>
    <button onclick="setBackground('theme2')">Theme 2</button>
    <button onclick="setBackground('theme3')">Theme 3</button>

    <label class="file-btn">
      Your Photos
      <input type="file" id="fileInput">
    </label>

    <button onclick="openURL()">Image URL</button>

    <h3>UI Opacity</h3>
    <input type="range" id="opacitySlider" min="0" max="1" step="0.02">

    <button onclick="closeSettings()">Close</button>

  </div>
</div>

<!-- URL POPUP -->
<div id="urlPopup">
  <div class="popup-card">
    <input type="text" id="urlInput" placeholder="Paste image URL">
    <button onclick="applyURL()">Apply</button>
    <button onclick="closeURL()">Cancel</button>
  </div>
</div>

<script>

/* NAVIGATION */
function openWhatsNew(){
  mainUI.style.display="none";
  whatsNewUI.style.display="flex";
}
function closeWhatsNew(){
  whatsNewUI.style.display="none";
  mainUI.style.display="flex";
}

/* SETTINGS */
function openSettings(){ settingsPanel.style.display="flex"; }
function closeSettings(){ settingsPanel.style.display="none"; }

/* DARK MODE */
const toggle = document.getElementById("themeToggle");
toggle.checked = localStorage.getItem("theme")==="true";
document.body.classList.toggle("dark", toggle.checked);

toggle.onchange=()=>{
  document.body.classList.toggle("dark", toggle.checked);
  localStorage.setItem("theme", toggle.checked);
};

/* COLOR */
const colorInput=document.getElementById("colorInput");
const setBtn=document.getElementById("setColorBtn");

colorInput.oninput=()=>{
  setBtn.style.display = colorInput.value ? "block" : "none";
};

setBtn.onclick=()=>{
  const val=colorInput.value.trim();
  if(!/^#([0-9A-F]{3}){1,2}$/i.test(val)) return;

  document.documentElement.style.setProperty('--accent', val);
  localStorage.setItem("color", val);
  setBtn.style.display="none";
};

const savedColor=localStorage.getItem("color");
if(savedColor){
  document.documentElement.style.setProperty('--accent', savedColor);
  colorInput.value=savedColor;
}

/* BACKGROUND SYSTEM */
const defaultBG="https://media.idownloadblog.com/wp-content/uploads/2017/06/iOS-10-3-3-wallpaper-1-iPad-AR72014.jpg";

const themes={
  theme1:"PASTE_THEME1_URL",
  theme2:"PASTE_THEME2_URL",
  theme3:"PASTE_THEME3_URL"
};

function setBackground(bg){
  if(bg==="default"){
    document.body.style.backgroundImage=`url('${defaultBG}')`;
    localStorage.setItem("background","default");
    localStorage.removeItem("customBG");
    return;
  }

  document.body.style.backgroundImage=`url('${themes[bg]}')`;
  localStorage.setItem("background",bg);
  localStorage.removeItem("customBG");
}

/* FILE */
fileInput.onchange=e=>{
  const file=e.target.files[0];
  if(!file) return;

  const reader=new FileReader();
  reader.onload=ev=>{
    document.body.style.backgroundImage=`url('${ev.target.result}')`;
    localStorage.setItem("customBG",ev.target.result);
    localStorage.removeItem("background");
  };
  reader.readAsDataURL(file);
};

/* URL */
function openURL(){ urlPopup.style.display="flex"; }
function closeURL(){ urlPopup.style.display="none"; }

function applyURL(){
  const url=urlInput.value.trim();
  if(!url) return;

  document.body.style.backgroundImage=`url('${url}')`;
  localStorage.setItem("customBG",url);
  localStorage.removeItem("background");
  closeURL();
}

/* RESTORE BACKGROUND (FIXED) */
const savedBG = localStorage.getItem("background");
const customBG = localStorage.getItem("customBG");

if(customBG){
  document.body.style.backgroundImage=`url('${customBG}')`;
}else if(savedBG && savedBG !== "default"){
  document.body.style.backgroundImage=`url('${themes[savedBG]}')`;
}else{
  document.body.style.backgroundImage=`url('${defaultBG}')`;
}

/* OPACITY */
const slider=document.getElementById("opacitySlider");
const savedOpacity=localStorage.getItem("opacity")||0.65;

slider.value=savedOpacity;
document.documentElement.style.setProperty('--card-opacity',savedOpacity);

slider.oninput=()=>{
  document.documentElement.style.setProperty('--card-opacity',slider.value);
  localStorage.setItem("opacity",slider.value);
};

</script>

</body>
</html>
