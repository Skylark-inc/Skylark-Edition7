<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Star</title>
<link rel="stylesheet" href="style.css">

<link rel="icon" href="https://endlesspete.github.io/Star/Favicon_use.jpeg">
<link rel="apple-touch-icon" href="https://endlesspete.github.io/Star/Appicon_star_ed7.png">
</head>

<body>

<div class="container">
  <div class="card">

    <h1>Star</h1>

    <p id="unsupportedMsg"></p>

    <a href="#" class="main-btn" id="getBtn">Get Star</a>

    <div class="sub-buttons">
      <button onclick="openSettings()">Settings</button>
      <button onclick="openWhatsNew()">What’s New</button>
    </div>

    <div class="credits">
      <p>© <a href="https://x.com/endlesspeteinc" target="_blank">Endlesspete</a></p>
      <p>© <a href="https://x.com/terralinkslabs" target="_blank">Terralinkslabs</a></p>
      <p>© <a href="https://x.com/SkylarkShortcut" target="_blank">Skylark Inc</a></p>
      <span>v1.0 Beta 7</span>
    </div>

  </div>
</div>

<!-- WHAT'S NEW -->
<div id="whatsNewUI">
  <div class="card">
    <h2>What’s New</h2>

    <p>
      • Placeholder updates<br>
      • UI polish<br>
      • Bug fixes
    </p>

    <div class="center">
      <button onclick="closeWhatsNew()">Back</button>
    </div>
  </div>
</div>

<!-- SETTINGS -->
<div id="settingsPanel">
  <div class="settings-card">

    <h2>Settings</h2>

    <div class="row">
      <span>Dark Mode</span>
      <label class="switch">
        <input type="checkbox" id="themeToggle">
        <span class="slider"></span>
      </label>
    </div>

    <h3>Background</h3>

    <div class="theme-grid">
      <button onclick="setBG('default')" id="defaultBtn">Default</button>
      <button onclick="setBG('theme1')" id="theme1Btn">Theme 1</button>
      <button onclick="setBG('theme2')" id="theme2Btn">Theme 2</button>
      <button onclick="setBG('theme3')" id="theme3Btn">Theme 3</button>
    </div>

    <label class="file-btn">
      Your Photos
      <input type="file" id="fileInput">
    </label>

    <button onclick="openURL()">Image URL</button>

    <button onclick="closeSettings()">Close</button>

  </div>
</div>

<!-- URL POPUP -->
<div id="urlPopup">
  <div class="popup-card">
    <input type="text" id="urlInput" placeholder="Paste image URL">
    <button onclick="applyURL()">Apply</button>
    <button onclick="closeURL()">Cancel</button>
  </div>
</div>

<!-- INFO BUTTON -->
<div id="infoBtn" onclick="openInfo()">i</div>

<!-- INFO POPUP -->
<div id="infoPopup">
  <div class="popup-card">
    <h3>Image Credit</h3>
    <p id="creditText">Theme credit placeholder</p>
    <button onclick="closeInfo()">Close</button>
  </div>
</div>

<script>

/* PLATFORM GATE */
const ua = navigator.userAgent;
const isApple = /iPhone|iPad|Macintosh/.test(ua);

if(!isApple){
  document.getElementById("getBtn").classList.add("disabled");
  document.getElementById("getBtn").innerText = "Not Supported";
  document.getElementById("unsupportedMsg").innerText =
    "This feature is not supported on your platform.";
  document.getElementById("unsupportedMsg").style.color = "red";
}

/* NAV */
function openWhatsNew(){ whatsNewUI.style.display="flex"; }
function closeWhatsNew(){ whatsNewUI.style.display="none"; }

/* SETTINGS */
function openSettings(){ settingsPanel.style.display="flex"; }
function closeSettings(){ settingsPanel.style.display="none"; }

/* DARK MODE */
themeToggle.checked = localStorage.getItem("dark")==="true";
document.body.classList.toggle("dark", themeToggle.checked);

themeToggle.onchange=()=>{
  document.body.classList.toggle("dark", themeToggle.checked);
  localStorage.setItem("dark", themeToggle.checked);
};

/* BACKGROUND */
const defaultBG="https://media.idownloadblog.com/wp-content/uploads/2017/06/iOS-10-3-3-wallpaper-1-iPad-AR72014.jpg";

const themes={
  theme1:{
    url:"PASTE_THEME1_URL",
    credit:"Theme 1 credit"
  },
  theme2:{
    url:"PASTE_THEME2_URL",
    credit:"Theme 2 credit"
  },
  theme3:{
    url:"PASTE_THEME3_URL",
    credit:"Theme 3 credit"
  }
};

function highlight(btn){
  document.querySelectorAll(".theme-grid button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
}

function setBG(bg){
  if(bg==="default"){
    document.body.style.backgroundImage=`url('${defaultBG}')`;
    infoBtn.style.display="none";
    localStorage.setItem("bg","default");
    highlight(defaultBtn);
    return;
  }

  document.body.style.backgroundImage=`url('${themes[bg].url}')`;
  creditText.innerText = themes[bg].credit;
  infoBtn.style.display="block";

  localStorage.setItem("bg",bg);
  highlight(document.getElementById(bg+"Btn"));
}

/* RESTORE */
const savedBG = localStorage.getItem("bg") || "default";
setBG(savedBG);

/* FILE */
fileInput.onchange=e=>{
  const reader=new FileReader();
  reader.onload=ev=>{
    document.body.style.backgroundImage=`url('${ev.target.result}')`;
    localStorage.setItem("customBG",ev.target.result);
    infoBtn.style.display="none";
  };
  reader.readAsDataURL(e.target.files[0]);
};

/* URL */
function openURL(){ urlPopup.style.display="flex"; }
function closeURL(){ urlPopup.style.display="none"; }

function applyURL(){
  const url=urlInput.value;
  document.body.style.backgroundImage=`url('${url}')`;
  localStorage.setItem("customBG",url);
  infoBtn.style.display="none";
  closeURL();
}

/* INFO */
function openInfo(){ infoPopup.style.display="flex"; }
function closeInfo(){ infoPopup.style.display="none"; }

</script>

</body>
</html>
