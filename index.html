<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skylark</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
  <div class="card">

    <h1>Skylark (Edition 27)</h1>
    <p class="sub-version">v1.0 Beta 1</p>

    <a class="main-btn">Get Skylark</a>

    <div class="sub-buttons">
      <button onclick="openSettings()">Settings</button>
      <button onclick="openWhatsNew()">What’s New</button>
    </div>

    <!-- ✅ FIXED: CLICKABLE LINKS -->
    <div class="credits">
      <a href="https://useskylark.github.io" target="_blank">© Skylark Inc</a>
      <a href="https://terralinkslabs.github.io" target="_blank">© Terralinkslabs</a>
      <a href="https://endlesspete.github.io" target="_blank">© Endlesspete</a>
    </div>

    <p class="version">v1.0 Beta 10</p>

  </div>
</div>

<!-- SETTINGS -->
<div id="settingsPanel">
  <div class="settings-card">

    <h2>Settings</h2>

    <div class="row">
      <span>Dark Mode</span>
      <label class="switch">
        <input type="checkbox" id="darkToggle">
        <span class="slider"></span>
      </label>
    </div>

    <div>
      <span>Custom Color</span>
      <div class="hex-row">
        <input type="text" id="hexInput" placeholder="007aff or #007aff">
        <button id="setColorBtn">Set</button>
      </div>
    </div>

    <h3>Background</h3>

    <div class="theme-grid">
      <button onclick="setTheme('default')">Default</button>
      <button onclick="setTheme('theme1')">Theme 1</button>
      <button onclick="setTheme('theme2')">Theme 2</button>
      <button onclick="setTheme('theme3')">Theme 3</button>
    </div>

    <label class="file-btn">
      Your Photos
      <input type="file" id="fileInput">
    </label>

    <!-- ✅ FIXED -->
    <button onclick="openURL()">Image URL</button>

    <div>
      <span>UI Opacity: <b id="opacityValue">65%</b></span>
      <input type="range" id="opacitySlider" min="0" max="100">
      <p id="opacityWarning" class="warning">Lower values may reduce readability</p>
    </div>

    <button onclick="closeSettings()">Close</button>

  </div>
</div>

<!-- WHAT'S NEW -->
<div id="whatsNewPanel">
  <div class="settings-card">
    <h2>What’s New</h2>
    <p>• UI Improvements</p>
    <p>• Bug fixes</p>
    <button onclick="closeWhatsNew()">Back</button>
  </div>
</div>

<!-- IMAGE URL POPUP -->
<div id="urlPopup">
  <div class="popup-card">
    <h3>Enter Image URL</h3>
    <input type="text" id="urlInput" placeholder="Paste image URL">

    <button onclick="applyURL()">Apply</button>
    <button onclick="closeURL()">Cancel</button>
  </div>
</div>

<script>

/* DEFAULT BG */
const defaultBG = "https://media.idownloadblog.com/wp-content/uploads/2017/06/iOS-10-3-3-wallpaper-1-iPad-AR72014.jpg";

/* APPLY BG */
function applyBG(url){
  document.body.style.backgroundImage = `url('${url}')`;
}

/* INIT */
const savedBG = localStorage.getItem("bg");
applyBG(savedBG || defaultBG);

/* THEMES */
function setTheme(name){
  const map = {
    theme1:"PASTE_THEME1",
    theme2:"PASTE_THEME2",
    theme3:"PASTE_THEME3"
  };

  const bg = name==="default" ? defaultBG : map[name];
  localStorage.setItem("bg", bg);
  applyBG(bg);
}

/* FILE */
fileInput.onchange = e=>{
  const file = e.target.files[0];
  const reader = new FileReader();

  reader.onload = ()=>{
    localStorage.setItem("bg", reader.result);
    applyBG(reader.result);
  };

  reader.readAsDataURL(file);
};

/* 🔥 FIXED IMAGE URL */
function openURL(){
  urlPopup.style.display = "flex";
}

function closeURL(){
  urlPopup.style.display = "none";
}

function applyURL(){
  const url = document.getElementById("urlInput").value.trim();
  if(!url) return;

  localStorage.setItem("bg", url);
  applyBG(url);
  closeURL();
}

/* 🔥 WHAT’S NEW FIX */
function openWhatsNew(){
  whatsNewPanel.style.display = "flex";
}
function closeWhatsNew(){
  whatsNewPanel.style.display = "none";
}

/* DARK MODE */
const darkToggle = document.getElementById("darkToggle");

if(localStorage.getItem("dark")==="true"){
  document.body.classList.add("dark");
  darkToggle.checked=true;
}

darkToggle.onchange = ()=>{
  document.body.classList.toggle("dark");
  localStorage.setItem("dark", darkToggle.checked);
};

/* 🔥 REAL OPACITY FIX */
const slider = document.getElementById("opacitySlider");
const value = document.getElementById("opacityValue");
const warning = document.getElementById("opacityWarning");

let savedOpacity = localStorage.getItem("opacity") || 65;

slider.value = savedOpacity;
value.innerText = savedOpacity + "%";

/* KEY FIX: TRUE ZERO */
function setOpacity(v){
  if(v == 0){
    document.documentElement.style.setProperty("--card-opacity", 0);
  } else {
    document.documentElement.style.setProperty("--card-opacity", v/100);
  }
}

setOpacity(savedOpacity);

slider.oninput = ()=>{
  value.innerText = slider.value + "%";
  setOpacity(slider.value);
  localStorage.setItem("opacity", slider.value);

  warning.style.display = slider.value < 50 ? "block" : "none";
};

/* HEX */
const hexInput = document.getElementById("hexInput");
const setBtn = document.getElementById("setColorBtn");

setBtn.style.display = "none";

hexInput.oninput = ()=>{
  setBtn.style.display = hexInput.value.trim() ? "block" : "none";
};

setBtn.onclick = ()=>{
  let val = hexInput.value.trim();
  if(!val) return;

  if(!val.startsWith("#")) val = "#" + val;

  if(/^#[0-9A-Fa-f]{6}$/.test(val)){
    document.documentElement.style.setProperty("--accent", val);
    localStorage.setItem("accent", val);
  }

  setBtn.style.display = "none";
};

const savedAccent = localStorage.getItem("accent");
if(savedAccent){
  document.documentElement.style.setProperty("--accent", savedAccent);
}

/* SETTINGS */
function openSettings(){ settingsPanel.style.display="flex"; }
function closeSettings(){ settingsPanel.style.display="none"; }

</script>

</body>
</html>
