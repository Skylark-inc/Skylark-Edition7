<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Skylark</title>

<link rel="stylesheet" href="style.css">

<link rel="icon" href="https://endlesspete.github.io/Star/Favicon_use.jpeg">
<link rel="apple-touch-icon" href="https://endlesspete.github.io/Star/Appicon_star_ed7.png">
</head>

<body>

<div class="container">
  <div class="card">

    <h1>Skylark (Edition 27)</h1>
    <p class="sub-version">v1.0 Beta 1</p>

    <a href="#" class="main-btn" id="mainBtn">Get Skylark</a>

    <div class="sub-buttons">
      <button onclick="openSettings()">Settings</button>
      <button onclick="openWhatsNew()">What’s New</button>
    </div>

    <p class="version">
      v1.0 Beta 10<br>
      © <a href="https://x.com/UseSkylark" target="_blank">Skylark Inc</a> |
      © <a href="https://x.com/terralinkslabs" target="_blank">Terralinkslabs</a> |
      © <a href="https://x.com/endlesspeteinc" target="_blank">Endlesspete</a>
    </p>

  </div>
</div>

<!-- SETTINGS -->
<div id="settingsPanel">
  <div class="settings-card">

    <h2>Settings</h2>

    <div class="toggle-row">
      <span>Dark Mode</span>
      <label class="switch">
        <input type="checkbox" id="darkToggle">
        <span class="slider"></span>
      </label>
    </div>

    <h3>Background</h3>

    <div class="theme-grid">
      <button onclick="applyBackground('default')">Default</button>
      <button onclick="applyBackground('Ella')">Ella</button>
      <button onclick="applyBackground('Glitter')">Glitter</button>
      <button onclick="applyBackground('Car Wash')">Car Wash</button>
    </div>

    <label class="file-btn">
      Your Photos
      <input type="file" id="fileInput" accept="image/*">
    </label>

    <button onclick="openURL()">Image URL</button>

    <label>UI Opacity: <b id="opacityValue">65%</b></label>
    <input type="range" id="opacitySlider" min="0" max="100">

    <p id="opacityWarning" class="warning">Lower values may reduce readability</p>

    <button onclick="closeSettings()">Close</button>

  </div>
</div>

<!-- WHAT'S NEW -->
<div id="whatsNewPanel">
  <div class="settings-card">
    <h2>What’s New</h2>
    <p>• Stable theme system restored</p>
    <p>• UI fixes</p>
    <button onclick="closeWhatsNew()">Back</button>
  </div>
</div>

<!-- URL POPUP -->
<div id="urlPopup">
  <div class="popup-card">
    <h3>Enter Image URL</h3>
    <input type="text" id="urlInput">
    <button onclick="applyURL()">Apply</button>
    <button onclick="closeURL()">Cancel</button>
  </div>
</div>

<script>

/* DEFAULT */
const defaultBG = "https://media.idownloadblog.com/wp-content/uploads/2017/06/iOS-10-3-3-wallpaper-1-iPad-AR72014.jpg";

/* THEMES */
const themes = {
  "Ella": "https://skylark-inc.github.io/Skylark-Edition7/Themes/Ella_202605_13.jpeg",
  "Glitter": "https://skylark-inc.github.io/Skylark-Edition7/Themes/IMG_0065.jpeg",
  "Car Wash": "https://skylark-inc.github.io/Skylark-Edition7/Themes/IMG_0144 202.JPG"
};

/* APPLY BACKGROUND */
function applyBackground(name){
  let url = defaultBG;

  if(name === "default"){
    localStorage.removeItem("bgTheme");
    localStorage.removeItem("bgCustom");
  }
  else if(themes[name]){
    url = themes[name];
    localStorage.setItem("bgTheme", name);
    localStorage.removeItem("bgCustom");
  }

  document.body.style.backgroundImage = `url('${url}')`;
}

/* RESTORE */
const savedTheme = localStorage.getItem("bgTheme");
const savedCustom = localStorage.getItem("bgCustom");

if(savedCustom){
  document.body.style.backgroundImage = `url('${savedCustom}')`;
}
else if(savedTheme){
  applyBackground(savedTheme);
}
else{
  applyBackground("default");
}

/* FILE */
fileInput.onchange = e=>{
  const file = e.target.files[0];
  const reader = new FileReader();

  reader.onload = ()=>{
    document.body.style.backgroundImage = `url('${reader.result}')`;
    localStorage.setItem("bgCustom", reader.result);
    localStorage.removeItem("bgTheme");
  };

  reader.readAsDataURL(file);
};

/* URL */
function openURL(){ urlPopup.style.display="flex"; }
function closeURL(){ urlPopup.style.display="none"; }

function applyURL(){
  const url = document.getElementById("urlInput").value.trim();
  if(!url) return;

  document.body.style.backgroundImage = `url('${url}')`;
  localStorage.setItem("bgCustom", url);
  localStorage.removeItem("bgTheme");

  closeURL();
}

/* SETTINGS */
function openSettings(){ settingsPanel.style.display="flex"; }
function closeSettings(){ settingsPanel.style.display="none"; }

/* WHAT'S NEW */
function openWhatsNew(){ whatsNewPanel.style.display="flex"; }
function closeWhatsNew(){ whatsNewPanel.style.display="none"; }

/* DARK MODE */
const darkToggle = document.getElementById("darkToggle");

const savedDark = localStorage.getItem("dark") === "true";
darkToggle.checked = savedDark;
document.body.classList.toggle("dark", savedDark);

darkToggle.onchange = ()=>{
  document.body.classList.toggle("dark");
  localStorage.setItem("dark", darkToggle.checked);
};

/* OPACITY (CARD ONLY) */
const slider = document.getElementById("opacitySlider");
const value = document.getElementById("opacityValue");
const warning = document.getElementById("opacityWarning");

let savedOpacity = localStorage.getItem("opacity") || 65;

slider.value = savedOpacity;
value.innerText = savedOpacity + "%";

function setOpacity(v){
  document.documentElement.style.setProperty("--card-opacity", v/100);
}

setOpacity(savedOpacity);

slider.oninput = ()=>{
  value.innerText = slider.value + "%";
  setOpacity(slider.value);
  localStorage.setItem("opacity", slider.value);

  warning.style.display = slider.value < 50 ? "block" : "none";
};

/* GET SKYLARK (Edition 7) */
document.getElementById("mainBtn").onclick = async () => {
  const res = await fetch("https://skylark-inc.github.io/Editions.json");
  const data = await res.json();

  const edition = data["Edition 7"];
  if(edition) window.location.href = edition.url;
};

</script>

</body>
</html>
