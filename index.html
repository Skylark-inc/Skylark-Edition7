<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Star</title>

<link rel="stylesheet" href="style.css">

<link rel="icon" href="https://endlesspete.github.io/Star/Favicon_use.jpeg">
<link rel="apple-touch-icon" href="https://endlesspete.github.io/Star/Appicon_star_ed7.png">
</head>

<body>

<div class="container">
  <div class="card">

    <h1>Star</h1>
    <span class="product-version">v1.0 Beta 1</span>

    <a href="#" id="getBtn" class="main-btn">Get Star</a>

    <div class="sub-buttons">
      <button onclick="openSettings()">Settings</button>
      <button onclick="openWhatsNew()">What’s New</button>
    </div>

    <div class="credits">
      <a href="https://x.com/Useskylark" target="_blank">© Skylark Inc</a>
      <a href="https://x.com/terralinkslabs" target="_blank">© Terralinkslabs</a>
      <a href="https://x.com/endlesspeteinc" target="_blank">© Endlesspete</a>
      <span>v1.0 Beta 8</span>
    </div>

  </div>
</div>

<!-- SETTINGS -->
<div id="settingsPanel">
  <div class="settings-card">

    <h2>Settings</h2>

    <div class="row">
      <span>Dark Mode</span>
      <label class="switch">
        <input type="checkbox" id="darkToggle">
        <span class="slider"></span>
      </label>
    </div>

    <h3>Background</h3>

    <div class="theme-grid">
      <button onclick="setTheme('default')">Default</button>
      <button onclick="setTheme('theme1')">Theme 1</button>
      <button onclick="setTheme('theme2')">Theme 2</button>
      <button onclick="setTheme('theme3')">Theme 3</button>
    </div>

    <label class="file-btn">
      Your Photos
      <input type="file" id="fileInput" accept="image/*">
    </label>

    <button onclick="openURL()">Image URL</button>

    <div class="opacity-section">
      <label>UI Opacity</label>
      <input type="range" id="opacitySlider" min="0.2" max="1" step="0.02">
    </div>

    <button onclick="closeSettings()">Close</button>

  </div>
</div>

<!-- WHAT’S NEW -->
<div id="whatsNewUI">
  <div class="settings-card">
    <h2>What’s New</h2>

    <ul>
      <li>Background memory fix</li>
      <li>UI improvements</li>
      <li>Better stability</li>
    </ul>

    <div class="center">
      <button onclick="closeWhatsNew()">Back</button>
    </div>
  </div>
</div>

<!-- URL POPUP -->
<div id="urlPopup">
  <div class="popup-card">
    <h3>Enter Image URL</h3>
    <input type="text" id="urlInput" placeholder="Paste image URL">
    <button onclick="applyURL()">Apply</button>
    <button onclick="closeURL()">Cancel</button>
  </div>
</div>

<!-- INFO BUTTON -->
<div id="infoBtn" onclick="openInfo()">i</div>

<div id="infoPopup">
  <div class="popup-card">
    <p id="infoText">Theme credit</p>
    <button onclick="closeInfo()">Close</button>
  </div>
</div>

<script>

/* =========================
   DEVICE CHECK
========================= */
const supported = /iPhone|iPad|Macintosh/.test(navigator.userAgent);
if(!supported){
  const btn = document.getElementById("getBtn");
  btn.classList.add("disabled");
  btn.innerText = "Not Supported";
}

/* =========================
   SETTINGS
========================= */
function openSettings(){
  settingsPanel.style.display="flex";
}
function closeSettings(){
  settingsPanel.style.display="none";
}

function openWhatsNew(){
  whatsNewUI.style.display="flex";
}
function closeWhatsNew(){
  whatsNewUI.style.display="none";
}

/* =========================
   DARK MODE
========================= */
const toggle = document.getElementById("darkToggle");

toggle.addEventListener("change",()=>{
  document.body.classList.toggle("dark",toggle.checked);
  localStorage.setItem("dark",toggle.checked);
});

if(localStorage.getItem("dark")==="true"){
  toggle.checked=true;
  document.body.classList.add("dark");
}

/* =========================
   BACKGROUND (FIXED MEMORY)
========================= */

const defaultBG = "https://media.idownloadblog.com/wp-content/uploads/2017/06/iOS-10-3-3-wallpaper-1-iPad-AR72014.jpg";

const themes = {
  theme1:"PASTE_THEME1_URL",
  theme2:"PASTE_THEME2_URL",
  theme3:"PASTE_THEME3_URL"
};

function setTheme(name){
  localStorage.setItem("bgType","theme");
  localStorage.setItem("bgValue",name);

  if(name==="default"){
    document.body.style.backgroundImage = `url('${defaultBG}')`;
  } else {
    document.body.style.backgroundImage = `url('${themes[name]}')`;
  }
}

/* FILE */
fileInput.addEventListener("change",e=>{
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = ev=>{
    localStorage.setItem("bgType","custom");
    localStorage.setItem("bgValue",ev.target.result);
    document.body.style.backgroundImage = `url('${ev.target.result}')`;
  };
  reader.readAsDataURL(file);
});

/* URL */
function openURL(){
  urlPopup.style.display="flex";
}
function closeURL(){
  urlPopup.style.display="none";
}

function applyURL(){
  const url = urlInput.value.trim();
  if(!url) return;

  const img = new Image();
  img.onload = ()=>{
    localStorage.setItem("bgType","custom");
    localStorage.setItem("bgValue",url);
    document.body.style.backgroundImage = `url('${url}')`;
    closeURL();
  };
  img.src = url;
}

/* RESTORE BACKGROUND (THIS IS THE REAL FIX) */
const type = localStorage.getItem("bgType");
const value = localStorage.getItem("bgValue");

if(type==="custom" && value){
  document.body.style.backgroundImage = `url('${value}')`;
}
else if(type==="theme" && value){
  if(value==="default"){
    document.body.style.backgroundImage = `url('${defaultBG}')`;
  } else {
    document.body.style.backgroundImage = `url('${themes[value]}')`;
  }
}
else{
  document.body.style.backgroundImage = `url('${defaultBG}')`;
}

/* =========================
   OPACITY
========================= */
const slider = document.getElementById("opacitySlider");

slider.addEventListener("input",()=>{
  document.documentElement.style.setProperty("--card-opacity",slider.value);
  localStorage.setItem("opacity",slider.value);
});

const savedOpacity = localStorage.getItem("opacity") || 0.65;
slider.value = savedOpacity;
document.documentElement.style.setProperty("--card-opacity",savedOpacity);

</script>

</body>
</html>
