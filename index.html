<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Star</title>
<link rel="stylesheet" href="style.css">

<link rel="icon" href="https://endlesspete.github.io/Star/Favicon_use.jpeg">
<link rel="apple-touch-icon" href="https://endlesspete.github.io/Star/Appicon_star_ed7.png">
</head>

<body>

<div class="container">
  <div class="card">

    <h1>Star</h1>

    <!-- MAIN BUTTON -->
    <a href="#" class="main-btn">Get Star</a>

    <!-- SMALL BUTTONS -->
    <div class="sub-buttons">
      <button onclick="openSettings()">Settings</button>
      <button onclick="openWhatsNew()">What’s New</button>
    </div>

    <div class="credits">
      <p>© <a href="https://x.com/endlesspeteinc" target="_blank">Endlesspete</a></p>
      <p>© <a href="https://x.com/terralinkslabs" target="_blank">Terralinkslabs</a></p>
      <p>© <a href="https://x.com/SkylarkShortcut" target="_blank">Skylark Inc</a></p>
      <span>v1.0 Beta 6</span>
    </div>

  </div>
</div>

<!-- WHAT'S NEW -->
<div id="whatsNewUI">
  <div class="card">
    <h2>What’s New</h2>

    <p>
      • Add your updates here<br>
      • UI improvements<br>
      • Bug fixes
    </p>

    <div class="center">
      <button onclick="closeWhatsNew()">Back</button>
    </div>
  </div>
</div>

<!-- SETTINGS -->
<div id="settingsPanel">
  <div class="settings-card">

    <h2>Settings</h2>

    <!-- DARK MODE -->
    <div class="row">
      <span>Dark Mode</span>
      <label class="switch">
        <input type="checkbox" id="themeToggle">
        <span class="slider"></span>
      </label>
    </div>

    <!-- COLOR -->
    <div class="row">
      <span>Custom Color</span>
      <input type="text" id="colorInput" placeholder="007aff">
    </div>

    <!-- THEMES -->
    <h3>Background</h3>

    <div class="theme-grid">
      <button onclick="setBG('default')" id="defaultBtn">Default</button>
      <button onclick="setBG('theme1')" id="theme1Btn">Theme 1</button>
      <button onclick="setBG('theme2')" id="theme2Btn">Theme 2</button>
      <button onclick="setBG('theme3')" id="theme3Btn">Theme 3</button>
    </div>

    <label class="file-btn">
      Your Photos
      <input type="file" id="fileInput">
    </label>

    <button onclick="openURL()">Image URL</button>

    <h3>UI Opacity</h3>
    <input type="range" id="opacitySlider" min="0" max="1" step="0.02">

    <button onclick="closeSettings()">Close</button>

  </div>
</div>

<!-- URL POPUP -->
<div id="urlPopup">
  <div class="popup-card">
    <input type="text" id="urlInput" placeholder="Paste image URL">
    <button onclick="applyURL()">Apply</button>
    <button onclick="closeURL()">Cancel</button>
  </div>
</div>

<script>

/* NAV */
function openWhatsNew(){
  document.getElementById("whatsNewUI").style.display="flex";
}
function closeWhatsNew(){
  document.getElementById("whatsNewUI").style.display="none";
}

/* SETTINGS */
function openSettings(){ settingsPanel.style.display="flex"; }
function closeSettings(){ settingsPanel.style.display="none"; }

/* DARK MODE */
const toggle = document.getElementById("themeToggle");
toggle.checked = localStorage.getItem("dark")==="true";

document.body.classList.toggle("dark", toggle.checked);

toggle.onchange=()=>{
  document.body.classList.toggle("dark", toggle.checked);
  localStorage.setItem("dark", toggle.checked);
};

/* COLOR FIX (# optional) */
const input = document.getElementById("colorInput");

input.value = localStorage.getItem("color") || "";

input.onchange = () => {
  let val = input.value.trim();
  if(!val.startsWith("#")) val = "#" + val;

  if(/^#([0-9A-F]{3}){1,2}$/i.test(val)){
    document.documentElement.style.setProperty('--accent', val);
    localStorage.setItem("color", val);
  }
};

const savedColor = localStorage.getItem("color");
if(savedColor){
  document.documentElement.style.setProperty('--accent', savedColor);
}

/* BACKGROUND */
const defaultBG="https://media.idownloadblog.com/wp-content/uploads/2017/06/iOS-10-3-3-wallpaper-1-iPad-AR72014.jpg";

const themes={
  theme1:"PASTE_THEME1_URL",
  theme2:"PASTE_THEME2_URL",
  theme3:"PASTE_THEME3_URL"
};

function highlight(btn){
  document.querySelectorAll(".theme-grid button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
}

function setBG(bg){
  if(bg==="default"){
    document.body.style.backgroundImage=`url('${defaultBG}')`;
    localStorage.setItem("bg","default");
    highlight(defaultBtn);
    return;
  }

  document.body.style.backgroundImage=`url('${themes[bg]}')`;
  localStorage.setItem("bg",bg);
  highlight(document.getElementById(bg+"Btn"));
}

/* RESTORE BG */
const savedBG = localStorage.getItem("bg") || "default";
setBG(savedBG);

/* FILE */
fileInput.onchange=e=>{
  const file=e.target.files[0];
  const reader=new FileReader();

  reader.onload=ev=>{
    document.body.style.backgroundImage=`url('${ev.target.result}')`;
    localStorage.setItem("customBG",ev.target.result);
  };

  reader.readAsDataURL(file);
};

/* URL */
function openURL(){ urlPopup.style.display="flex"; }
function closeURL(){ urlPopup.style.display="none"; }

function applyURL(){
  const url=urlInput.value;
  document.body.style.backgroundImage=`url('${url}')`;
  localStorage.setItem("customBG",url);
  closeURL();
}

/* OPACITY */
const slider=document.getElementById("opacitySlider");
slider.value=localStorage.getItem("opacity")||0.65;

slider.oninput=()=>{
  document.documentElement.style.setProperty('--card-opacity',slider.value);
  localStorage.setItem("opacity",slider.value);
};

</script>

</body>
</html>
