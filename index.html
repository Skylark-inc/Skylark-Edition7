<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Star</title>

<link rel="stylesheet" href="style.css">

<link rel="icon" href="https://endlesspete.github.io/Star/Favicon_use.jpeg">
<link rel="apple-touch-icon" href="https://endlesspete.github.io/Star/Appicon_star_ed7.png">
</head>

<body>

<div class="container">

  <div class="card">

    <h1>Star</h1>
    <p class="sub-version">v1.0 Beta 1</p>

    <a id="mainBtn" class="main-btn">Get Star</a>

    <div class="sub-buttons">
      <button onclick="openSettings()">Settings</button>
      <button onclick="openWhatsNew()">What’s New</button>
    </div>

    <p id="unsupportedText" class="unsupported-text"></p>

    <div class="credits">
      © <a href="https://x.com/Useskylark" target="_blank">Skylark Inc</a>
      © <a href="https://x.com/terralinkslabs" target="_blank">Terralinkslabs</a>
      © <a href="https://x.com/endlesspeteinc" target="_blank">Endlesspete</a>
    </div>

    <p class="version">v1.0 Beta 9</p>

  </div>
</div>

<!-- SETTINGS -->
<div id="settingsPanel">
  <div class="settings-card">

    <h2>Settings</h2>

    <div class="row">
      <span>Dark Mode</span>
      <label class="switch">
        <input type="checkbox" id="darkToggle">
        <span class="slider"></span>
      </label>
    </div>

    <!-- HEX -->
    <div>
      <span>Custom Color</span>
      <input type="text" id="hexInput" placeholder="007aff or #007aff">
      <button id="setColorBtn" style="display:none;">Set</button>
    </div>

    <!-- BACKGROUND -->
    <h3>Background</h3>

    <div class="theme-grid">
      <button onclick="setTheme('default')" id="defaultBtn">Default</button>
      <button onclick="setTheme('theme1')" id="theme1Btn">Theme 1</button>
      <button onclick="setTheme('theme2')" id="theme2Btn">Theme 2</button>
      <button onclick="setTheme('theme3')" id="theme3Btn">Theme 3</button>
    </div>

    <button onclick="useSavedImage()" id="imageBtn" disabled>Image</button>

    <label class="file-btn">
      Your Photos
      <input type="file" id="fileInput">
    </label>

    <button onclick="openURL()">Image URL</button>

    <!-- SLIDER -->
    <span>UI Opacity</span>
    <input type="range" id="opacitySlider" min="0.2" max="1" step="0.01">

    <button onclick="closeSettings()">Close</button>

  </div>
</div>

<!-- URL POPUP -->
<div id="urlPopup">
  <div class="popup-card">
    <h3>Enter Image URL</h3>

    <input id="urlInput" type="text" placeholder="Paste image URL">

    <button onclick="pasteURL()">Paste</button>
    <button onclick="applyURL()">Apply</button>
    <button onclick="closeURL()">Cancel</button>
  </div>
</div>

<!-- WHATS NEW -->
<div id="whatsNewUI">
  <div class="settings-card">
    <h2>What’s New</h2>

    <ul>
      <li>Add your updates here</li>
      <li>UI improvements</li>
      <li>Bug fixes</li>
    </ul>

    <div class="center">
      <button onclick="closeWhatsNew()">Back</button>
    </div>
  </div>
</div>

<!-- INFO BUTTON -->
<div id="infoButton">i</div>

<script>

/* PLATFORM CHECK */
const supported = /iPhone|iPad|Mac/.test(navigator.userAgent);
if(!supported){
  document.getElementById("mainBtn").classList.add("disabled");
  document.getElementById("unsupportedText").innerText =
    "⚠️ Not supported on this platform";
}

/* SETTINGS */
function openSettings(){ settingsPanel.style.display="flex"; }
function closeSettings(){ settingsPanel.style.display="none"; }

/* WHATS NEW */
function openWhatsNew(){ whatsNewUI.style.display="flex"; }
function closeWhatsNew(){ whatsNewUI.style.display="none"; }

/* URL POPUP */
function openURL(){ urlPopup.style.display="flex"; }
function closeURL(){ urlPopup.style.display="none"; }

/* PASTE */
async function pasteURL(){
  const text = await navigator.clipboard.readText();
  urlInput.value = text;
}

/* BACKGROUNDS */
const defaultBG = "https://media.idownloadblog.com/wp-content/uploads/2017/06/iOS-10-3-3-wallpaper-1-iPad-AR72014.jpg";

const themes = {
  theme1:"PASTE_THEME1",
  theme2:"PASTE_THEME2",
  theme3:"PASTE_THEME3"
};

function applyBG(url){
  document.body.style.backgroundImage = `url('${url}')`;
}

function setTheme(t){
  localStorage.setItem("mode","theme");
  localStorage.setItem("theme",t);
  localStorage.removeItem("savedImage");

  applyThemeHighlight(t);

  applyBG(t==="default" ? defaultBG : themes[t]);
}

function applyThemeHighlight(t){
  document.querySelectorAll(".theme-grid button").forEach(b=>b.classList.remove("active"));
  if(t!=="default") document.getElementById(t+"Btn").classList.add("active");
}

/* FILE */
fileInput.onchange = e=>{
  const file = e.target.files[0];
  const reader = new FileReader();

  reader.onload = ()=>{
    localStorage.setItem("mode","custom");
    localStorage.setItem("savedImage",reader.result);

    applyBG(reader.result);
    imageBtn.disabled=false;
  };

  reader.readAsDataURL(file);
};

/* URL */
function applyURL(){
  const url = urlInput.value.trim();

  const img = new Image();
  img.onload = ()=>{
    localStorage.setItem("mode","custom");
    localStorage.setItem("savedImage",url);

    applyBG(url);
    imageBtn.disabled=false;

    closeURL();
  };
  img.src = url;
}

/* IMAGE BUTTON */
function useSavedImage(){
  const img = localStorage.getItem("savedImage");
  if(img){
    applyBG(img);
    localStorage.setItem("mode","custom");
  }
}

/* RESTORE BG */
const mode = localStorage.getItem("mode");

if(mode==="custom"){
  const img = localStorage.getItem("savedImage");
  if(img){
    applyBG(img);
    imageBtn.disabled=false;
  }
}
else if(mode==="theme"){
  const t = localStorage.getItem("theme");
  setTheme(t);
}
else{
  applyBG(defaultBG);
}

/* HEX COLOR */
const hexInput = document.getElementById("hexInput");
const setBtn = document.getElementById("setColorBtn");

hexInput.addEventListener("input", ()=>{
  setBtn.style.display = hexInput.value ? "block" : "none";
});

setBtn.onclick = ()=>{
  let val = hexInput.value.trim();
  if(!val.startsWith("#")) val = "#"+val;

  document.documentElement.style.setProperty("--accent", val);
  localStorage.setItem("accent", val);

  setBtn.style.display="none";
};

const savedAccent = localStorage.getItem("accent");
if(savedAccent){
  document.documentElement.style.setProperty("--accent", savedAccent);
}

/* DARK MODE */
darkToggle.onchange = ()=>{
  document.body.classList.toggle("dark", darkToggle.checked);
};

/* OPACITY */
opacitySlider.oninput = ()=>{
  document.documentElement.style.setProperty("--card-opacity", opacitySlider.value);
  localStorage.setItem("opacity", opacitySlider.value);
};

const savedOp = localStorage.getItem("opacity");
if(savedOp){
  opacitySlider.value = savedOp;
  document.documentElement.style.setProperty("--card-opacity", savedOp);
}

</script>

</body>
</html>
