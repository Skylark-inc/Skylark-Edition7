<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Star</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
  <div class="card">

    <h1>Star</h1>
    <p class="sub-version">v1.0 Beta 1</p>

    <a id="mainBtn" class="main-btn">Get Star</a>

    <div class="sub-buttons">
      <button onclick="openSettings()">Settings</button>
      <button onclick="alert('Whats new placeholder')">What’s New</button>
    </div>

    <div class="credits">
      <a href="#">© Skylark Inc</a>
      <a href="#">© Terralinkslabs</a>
      <a href="#">© Endlesspete</a>
    </div>

    <p class="version">v1.0 Beta 10</p>

  </div>
</div>

<!-- INFO BUTTON -->
<div id="infoButton" onclick="showInfo()">i</div>

<!-- SETTINGS -->
<div id="settingsPanel">
  <div class="settings-card">

    <h2>Settings</h2>

    <div class="row">
      <span>Dark Mode</span>
      <label class="switch">
        <input type="checkbox" id="darkToggle">
        <span class="slider"></span>
      </label>
    </div>

    <!-- HEX -->
    <div>
      <span>Custom Color</span>
      <input type="text" id="hexInput" placeholder="007aff or #007aff">
      <button id="setColorBtn">Set</button>
    </div>

    <h3>Background</h3>

    <div class="theme-grid">
      <button onclick="setTheme('default')">Default</button>
      <button onclick="setTheme('theme1')">Theme 1</button>
      <button onclick="setTheme('theme2')">Theme 2</button>
      <button onclick="setTheme('theme3')">Theme 3</button>
    </div>

    <button id="imageBtn" onclick="useSavedImage()" disabled>Image</button>

    <label class="file-btn">
      Your Photos
      <input type="file" id="fileInput">
    </label>

    <button onclick="openURL()">Image URL</button>

    <div>
      <span>UI Opacity: <b id="opacityValue">65%</b></span>
      <input type="range" id="opacitySlider" min="0" max="100">
      <p class="warning">Lower values may reduce readability</p>
    </div>

    <button onclick="closeSettings()">Close</button>

  </div>
</div>

<script>

/* DEFAULT BG */
const defaultBG = "https://media.idownloadblog.com/wp-content/uploads/2017/06/iOS-10-3-3-wallpaper-1-iPad-AR72014.jpg";

/* APPLY BG */
function applyBG(url){
  document.body.style.backgroundImage = `url('${url}')`;
}

/* INIT BG */
const savedBG = localStorage.getItem("bg");
applyBG(savedBG || defaultBG);

/* THEMES */
function setTheme(name){
  const map = {
    theme1:"PASTE_THEME1",
    theme2:"PASTE_THEME2",
    theme3:"PASTE_THEME3"
  };

  const bg = name==="default" ? defaultBG : map[name];

  localStorage.setItem("bg", bg);
  localStorage.setItem("theme", name);

  applyBG(bg);
  updateInfoButton(name);
}

/* FILE */
fileInput.onchange = e=>{
  const file = e.target.files[0];
  const reader = new FileReader();

  reader.onload = ()=>{
    localStorage.setItem("bg", reader.result);
    localStorage.removeItem("theme");

    applyBG(reader.result);
    imageBtn.disabled=false;
    updateInfoButton(null);
  };

  reader.readAsDataURL(file);
};

/* IMAGE BUTTON */
function useSavedImage(){
  const bg = localStorage.getItem("bg");
  if(bg) applyBG(bg);
}

/* INFO BUTTON */
function updateInfoButton(theme){
  const btn = document.getElementById("infoButton");
  btn.style.display = (theme && theme !== "default") ? "flex" : "none";
}
updateInfoButton(localStorage.getItem("theme"));

function showInfo(){
  alert("Theme credit here");
}

/* DARK MODE */
const darkToggle = document.getElementById("darkToggle");

if(localStorage.getItem("dark")==="true"){
  document.body.classList.add("dark");
  darkToggle.checked=true;
}

darkToggle.onchange = ()=>{
  document.body.classList.toggle("dark");
  localStorage.setItem("dark", darkToggle.checked);
};

/* OPACITY */
const slider = document.getElementById("opacitySlider");
const value = document.getElementById("opacityValue");
const warning = document.querySelector(".warning");

const savedOpacity = localStorage.getItem("opacity") || 65;

slider.value = savedOpacity;
value.innerText = savedOpacity+"%";

document.documentElement.style.setProperty("--card-opacity", savedOpacity/100);

slider.oninput = ()=>{
  const val = slider.value;

  value.innerText = val+"%";

  document.documentElement.style.setProperty("--card-opacity", val/100);
  localStorage.setItem("opacity", val);

  warning.style.display = val <= 40 ? "block" : "none";
};

/* HEX */
const hexInput = document.getElementById("hexInput");
const setBtn = document.getElementById("setColorBtn");

setBtn.style.display = "none";

hexInput.oninput = ()=>{
  setBtn.style.display = hexInput.value ? "inline-block" : "none";
};

setBtn.onclick = ()=>{
  let val = hexInput.value.trim();
  if(!val) return;

  if(!val.startsWith("#")) val = "#"+val;

  if(!/^#[0-9A-Fa-f]{6}$/.test(val)){
    alert("Invalid hex");
    return;
  }

  document.documentElement.style.setProperty("--accent", val);
  localStorage.setItem("accent", val);

  setBtn.style.display="none";
};

/* SETTINGS */
function openSettings(){ settingsPanel.style.display="flex"; }
function closeSettings(){ settingsPanel.style.display="none"; }

</script>

</body>
</html>
